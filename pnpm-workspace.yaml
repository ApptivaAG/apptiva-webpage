allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Auto-install peer dependencies
autoInstallPeers: true

# Dependency update settings
updateConfig:
  ignoreDependencies:
    - remark-gfm
    - next-mdx-remote

# Overrides for security fixes and version pinning
overrides:
  js-yaml: ">=3.14.2"
  uuid: ">=14.0.0"
  postcss: "^8.5.15"
  brace-expansion: ">=5.0.6"
  jsdom: "27.3.0"
  next@>=16.0.0 <16.3.3: ^16.3.3

minimumReleaseAgeExclude:
  - resend@6.18.1
  - adm-zip@0.6.0 || 0.6.1
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - next@16.3.3
  - qs@6.15.4 || 6.16.0
  - sharp@0.35.4
  - '@rolldown/binding-openharmony-arm64@1.2.8'
